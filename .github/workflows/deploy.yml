# web-receipt のデプロイ（Go の Lambda + React の S3/CloudFront を SAM で）。
#
# 原則:
#   1. verify が通らなければデプロイしない（needs）
#   2. AWS 認証は OIDC のみ。アクセスキーを Secrets に置かない
#   3. main への push は dev 環境へ自動デプロイする。stg / prod は workflow_dispatch で
#      環境を選んで手動実行する（本番は人が押すまで出ない）
#
# 事前に必要なもの:
#   - infra/terraform で作る ECR リポジトリ（web-receipt-go）
#   - 既存の VPC と RDS PostgreSQL（Lambda から 5432 で届くこと）
#   - GitHub Secrets: AWS_DEPLOY_ROLE_ARN / DB_HOST / DB_SECRET_ARN / VPC_SUBNET_IDS / LAMBDA_SG_ID
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: デプロイ先環境
        type: choice
        options: [dev, stg, prod]
        default: dev

# OIDC でロールを引き受けるために id-token: write が要る
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ENV_NAME: ${{ inputs.env || 'dev' }}
  ECR_REPOSITORY: web-receipt-go

# 同じ環境へのデプロイを重ねない（後から来た方を待たせる）
concurrency:
  group: deploy-${{ inputs.env || 'dev' }}
  cancel-in-progress: false

jobs:
  # AWS の Secrets が設定されているかを判定する。未設定ならデプロイ系はスキップして
  # ワークフロー全体は成功で終える（clone しただけの状態で常に赤くしないため）。
  gate:
    name: デプロイ可否の判定
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.check.outputs.deployable }}
    steps:
      - id: check
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEPLOY_ROLE_ARN が未設定のため、デプロイ系ジョブをスキップします。"
          fi

  # デプロイ前に必ず層検証を通す（Secrets の有無にかかわらず常に実行）
  verify:
    uses: ./.github/workflows/verify.yml

  backend:
    name: バックエンド（Go の Lambda イメージ）
    needs: [gate, verify]
    if: needs.gate.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      # action はコミット SHA で固定する（タグは付け替えられるため）
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: イメージのビルドと push
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          # タグはコミット SHA（ECR は IMMUTABLE なので同じタグの上書きは拒否される）
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          # Lambda は arm64（template.yaml の Architectures と揃える）
          docker buildx build --platform linux/arm64 --provenance=false \
            -f docker/go/Dockerfile --target lambda \
            -t "$IMAGE" --push go
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  infra:
    name: SAM デプロイ
    needs: [backend]
    runs-on: ubuntu-latest
    outputs:
      api-url: ${{ steps.out.outputs.api-url }}
      frontend-url: ${{ steps.out.outputs.frontend-url }}
      frontend-bucket: ${{ steps.out.outputs.frontend-bucket }}
      distribution: ${{ steps.out.outputs.distribution }}
      user-pool-id: ${{ steps.out.outputs.user-pool-id }}
      client-id: ${{ steps.out.outputs.client-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true
      - name: デプロイ
        # Secrets は環境変数で渡す（${{ }} でシェルに直接埋め込むと、値の記号でコマンドが壊れる）
        env:
          GO_IMAGE: ${{ needs.backend.outputs.image }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_SECRET_ARN: ${{ secrets.DB_SECRET_ARN }}
          VPC_SUBNET_IDS: ${{ secrets.VPC_SUBNET_IDS }}
          LAMBDA_SG_ID: ${{ secrets.LAMBDA_SG_ID }}
        run: |
          set -euo pipefail
          sam deploy \
            --template-file infra/sam/template.yaml \
            --stack-name "web-receipt-${ENV_NAME}" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Env="$ENV_NAME" \
              GoImageUri="$GO_IMAGE" \
              DbHost="$DB_HOST" \
              DbSecretArn="$DB_SECRET_ARN" \
              VpcSubnetIds="$VPC_SUBNET_IDS" \
              LambdaSecurityGroupId="$LAMBDA_SG_ID"
      - name: 出力を取り出す
        id: out
        run: |
          set -euo pipefail
          get() {
            aws cloudformation describe-stacks --stack-name "web-receipt-${ENV_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          {
            echo "api-url=$(get ApiUrl)"
            echo "frontend-url=$(get FrontendUrl)"
            echo "frontend-bucket=$(get FrontendBucketName)"
            echo "distribution=$(get DistributionId)"
            echo "user-pool-id=$(get UserPoolId)"
            echo "client-id=$(get UserPoolClientId)"
          } >> "$GITHUB_OUTPUT"

  frontend:
    name: フロント（S3 + CloudFront）
    needs: [infra]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: ビルド
        # VITE_* はビルド時に埋め込まれる（実行時に差し替えられないので環境ごとにビルドする）
        env:
          VITE_API_BASE_URL: ${{ needs.infra.outputs.api-url }}
          VITE_COGNITO_AUTHORITY: https://cognito-idp.ap-northeast-1.amazonaws.com/${{ needs.infra.outputs.user-pool-id }}
          VITE_COGNITO_CLIENT_ID: ${{ needs.infra.outputs.client-id }}
          VITE_COGNITO_REDIRECT_URI: ${{ needs.infra.outputs.frontend-url }}
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: S3 へ同期し、CloudFront のキャッシュを消す
        env:
          BUCKET: ${{ needs.infra.outputs.frontend-bucket }}
          DISTRIBUTION: ${{ needs.infra.outputs.distribution }}
        run: |
          set -euo pipefail
          aws s3 sync dist/ "s3://$BUCKET/" --delete
          # 打ち忘れると古い JS が配信され続ける
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*'
