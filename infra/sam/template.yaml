AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: web-receipt — Go(Lambda) + React(S3 + CloudFront) + Cognito + RDS PostgreSQL

# 環境（dev / stg / prod）はスタックを分けて持つ（スタック名に環境名を含める）。
# HTTP API のステージは $default にしている。名前付きステージにすると Lambda に渡る
# rawPath の先頭にステージ名が付き、Go 側の /api/... のルートと一致しなくなるため。

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, stg, prod]
    Default: dev
  GoImageUri:
    Type: String
    Description: ECR に push 済みの Go コンテナイメージ URI（docker/go/Dockerfile の lambda ステージ）
  DbHost:
    Type: String
    Description: RDS PostgreSQL のエンドポイント
  DbSecretArn:
    Type: String
    Description: DB 認証情報を保持する Secrets Manager の ARN（RDS が作る形式 {"username", "password"} の JSON）
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Lambda を置くサブネット（RDS に届くプライベートサブネット）
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Lambda のセキュリティグループ（RDS のセキュリティグループで 5432 を許可しておく）

Globals:
  Function:
    Timeout: 29              # API Gateway 側の上限が 29 秒。これ以上にしても意味がない
    MemorySize: 512          # PDF 生成（fpdf・日本語フォント）を含めても 512MB で足りる
    Architectures: [arm64]   # docker/go/Dockerfile は arm64 でビルドする（揃えないと exec format error）
    Tracing: Active

Resources:
  # ── 認証 ───────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # メンバーは組織の管理者が登録する（自己サインアップはさせない）
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      # 誤削除でユーザー全消失を防ぐ
      DeletionProtection: ACTIVE

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${AWS::StackName}-web'
      # SPA なのでクライアントシークレットを持たせない（隠せないため）
      GenerateSecret: false
      # サインインは Go が InitiateAuth(USER_PASSWORD_AUTH) で行う（フォーム方式）
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - !Sub 'https://${Distribution.DomainName}'
      LogoutURLs:
        - !Sub 'https://${Distribution.DomainName}'

  # ── バックエンド（Go・Lambda コンテナ）────────────────────────
  GoFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref GoImageUri
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: '5432'
          DB_NAME: app
          DB_SSLMODE: require
          # DB の認証情報は Secrets Manager から動的参照で渡す（値をリポジトリにも
          # GitHub Secrets にも置かない）。解決後の値は Lambda の設定として保存される
          DB_USER: !Sub '{{resolve:secretsmanager:${DbSecretArn}:SecretString:username}}'
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DbSecretArn}:SecretString:password}}'
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          S3_BUCKET: !Ref AssetBucket
          # ブラウザから API を呼べるオリジン。フロントの CloudFront だけに絞る
          CORS_ALLOWED_ORIGINS: !Sub 'https://${Distribution.DomainName}'
      Policies:
        # ヘルスチェックの HeadBucket に必要（PDF はメモリ上で生成し、S3 には置かない）
        - S3ReadPolicy: { BucketName: !Ref AssetBucket }
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:DescribeUserPool      # ヘルスチェック
                - cognito-idp:AdminCreateUser       # 管理者によるメンバー登録
                - cognito-idp:AdminSetUserPassword  # 登録時の初期パスワード確定
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: [!Sub 'https://${Distribution.DomainName}']
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]

  # ── ストレージ ─────────────────────────────────────────────
  AssetBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  # ── フロント（S3 + CloudFront）──────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      # CloudFront(OAC) 経由のみで配信する。バケットは非公開のまま
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: s3-frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: s3-frontend
          ViewerProtocolPolicy: redirect-to-https
          # CachingOptimized（AWS マネージド）
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        # SPA のクライアントサイドルーティング対応（/view/:viewID へ直接来たときなど）
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  # フロントは VITE_API_BASE_URL にこの値を入れ、/api/... を呼ぶ
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  FrontendUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref Distribution
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
